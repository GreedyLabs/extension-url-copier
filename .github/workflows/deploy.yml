name: Deploy Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation (status does not modify the store)
        type: choice
        options: [status, upload, publish, deploy]
        default: status
      source-run-id:
        description: Original upload run (optional; matching upload is selected automatically)
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test
        run: npm test

  deploy:
    name: Deploy extension
    needs: check
    # PRs run checks only; the shared workflow owns packaging and store deployment.
    if: github.event_name != 'pull_request'
    uses: GreedyLabs/action-deploy-browser-extension/.github/workflows/deploy.yml@v2
    with:
      operation: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') && 'publish' || 'upload') || inputs.operation }}
      targets: chrome
      source-run-id: ${{ inputs.source-run-id }}
      build-command: npm run build:zip
      zip-path: url-copier.zip
      chrome-publisher-id: ${{ vars.CHROME_PUBLISHER_ID }}
      chrome-extension-id: ${{ vars.CHROME_EXTENSION_ID }}
    secrets:
      CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
